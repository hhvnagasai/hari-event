name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and Notify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: false
          command_timeout: 60m
          script: |

            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"
            WORKFLOW="${{ github.workflow }}"
            WEBHOOK="${{ secrets.ROCKETCHAT_WEBHOOK }}"

            send_failure() {
              STAGE="$1"
              LOGFILE="$2"

              ERROR_LOG=$(tail -20 "$LOGFILE")

              cat >/tmp/rocketchat.json <<JSON
{
  "text": "🚨 CI/CD FAILURE

Repository : $REPO
Branch     : $BRANCH
Workflow   : $WORKFLOW

Failed Stage
------------------------
$STAGE
------------------------

Error Log
------------------------
$ERROR_LOG
------------------------

Result
------------------------
Deployment Stopped
------------------------"
}
JSON

              curl -s \
                -H "Content-Type: application/json" \
                -X POST \
                --data-binary @/tmp/rocketchat.json \
                "$WEBHOOK"

              exit 1
            }

            send_success() {

              cat >/tmp/rocketchat.json <<JSON
{
  "text": "✅ DEPLOYMENT SUCCESSFUL

Repository : $REPO
Branch     : $BRANCH
Workflow   : $WORKFLOW

Deployment Summary
------------------------
Git Pull ✓
Backend Install ✓
Frontend Install ✓
Frontend Build ✓
PM2 Backend ✓
PM2 Frontend ✓
------------------------

Status
------------------------
Production Updated Successfully
------------------------"
}
JSON

              curl -s \
                -H "Content-Type: application/json" \
                -X POST \
                --data-binary @/tmp/rocketchat.json \
                "$WEBHOOK"
            }

            cd /home/ec2-user/hari-event || send_failure "Repository Access" "/etc/hosts"

            git fetch origin > /tmp/git.log 2>&1
            [ $? -eq 0 ] || send_failure "Git Pull" "/tmp/git.log"

            git reset --hard origin/main >> /tmp/git.log 2>&1
            [ $? -eq 0 ] || send_failure "Git Pull" "/tmp/git.log"

            cd backend

            npm install --legacy-peer-deps > /tmp/backend.log 2>&1
            [ $? -eq 0 ] || send_failure "Backend Install" "/tmp/backend.log"

            cd ../frontend

            npm install --legacy-peer-deps > /tmp/frontend-install.log 2>&1
            [ $? -eq 0 ] || send_failure "Frontend Install" "/tmp/frontend-install.log"

            npm run build > /tmp/frontend-build.log 2>&1
            [ $? -eq 0 ] || send_failure "Frontend Build" "/tmp/frontend-build.log"

            pm2 restart hari-event-backend > /tmp/pm2-backend.log 2>&1
            [ $? -eq 0 ] || send_failure "PM2 Restart Backend" "/tmp/pm2-backend.log"

            pm2 restart hari-event-frontend > /tmp/pm2-frontend.log 2>&1
            [ $? -eq 0 ] || send_failure "PM2 Restart Frontend" "/tmp/pm2-frontend.log"

            pm2 save >/dev/null 2>&1

            send_success
