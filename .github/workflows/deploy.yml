name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend Install
        run: |
          cd frontend

          npm install > frontend_install.log 2>&1

          if [ $? -ne 0 ]; then
            ERROR=$(tail -20 frontend_install.log | tr '\n' ' ' | sed 's/"/\\"/g')

            curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"❌ FRONTEND INSTALL FAILED | Repo: ${{ github.repository }} | Error: $ERROR\"}"

            exit 1
          fi

      - name: Frontend Build
        run: |
          cd frontend

          npm run build > frontend_build.log 2>&1

          if [ $? -ne 0 ]; then
            ERROR=$(tail -20 frontend_build.log | tr '\n' ' ' | sed 's/"/\\"/g')

            curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"❌ FRONTEND BUILD FAILED | Repo: ${{ github.repository }} | Error: $ERROR\"}"

            exit 1
          fi

      - name: Backend Install
        run: |
          cd backend

          npm install --legacy-peer-deps > backend_install.log 2>&1

          if [ $? -ne 0 ]; then
            ERROR=$(tail -20 backend_install.log | tr '\n' ' ' | sed 's/"/\\"/g')

            curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"❌ BACKEND INSTALL FAILED | Repo: ${{ github.repository }} | Error: $ERROR\"}"

            exit 1
          fi

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /root/hari-event

            git pull origin main

            cd backend

            npm install --legacy-peer-deps

            pm2 restart hari-backend || pm2 start server.js --name hari-backend

            pm2 save

      - name: Success Notification
        run: |
          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ DEPLOYMENT SUCCESSFUL | Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
