name: Deploy Application

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Frontend Dependencies
    run: |
      cd frontend
      npm install

  - name: Build Frontend
    run: |
      cd frontend
      npm run build

  - name: Install Backend Dependencies
    run: |
      cd backend
      npm install --legacy-peer-deps
```

deploy:
needs: build
runs-on: ubuntu-latest

```
steps:
  - name: Deploy to EC2
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USER }}
      key: ${{ secrets.EC2_SSH_KEY }}
      script: |
        cd /root/hari-event
        git pull origin main
        cd backend
        npm install --legacy-peer-deps
        pm2 restart hari-backend
        pm2 save
```

notify-success:
needs: deploy
runs-on: ubuntu-latest

```
steps:
  - name: Send Success Message
    run: |
      curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
        -H "Content-Type: application/json" \
        --data "{\"text\":\"✅ Deployment Successful\nRepository: ${{ github.repository }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
```

notify-failure:
if: failure()
needs: [build, deploy]
runs-on: ubuntu-latest

```
steps:
  - name: Send Failure Message
    run: |
      curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
        -H "Content-Type: application/json" \
        --data "{\"text\":\"❌ Deployment Failed\nRepository: ${{ github.repository }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
```

