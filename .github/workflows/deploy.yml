name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and Notify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: false

          script: |
            WEBHOOK="${{ secrets.ROCKETCHAT_WEBHOOK }}"

            cd /home/ec2-user/hari-event/frontend

            npm run build >/tmp/build.log 2>&1

            if [ $? -ne 0 ]; then

              ERROR_LOG=$(tail -20 /tmp/build.log | tr '"' "'" | sed ':a;N;$!ba;s/\n/\\n/g')

              printf '{"text":"🚨 CI/CD FAILURE\n\nFailed Stage: Frontend Build\n\nError Log\n%s"}' "$ERROR_LOG" > /tmp/rocket.json

              curl -s \
                -H "Content-Type: application/json" \
                -X POST \
                --data @/tmp/rocket.json \
                "$WEBHOOK"

              exit 1
            fi

            printf '{"text":"✅ DEPLOYMENT SUCCESSFUL"}' > /tmp/rocket.json

            curl -s \
              -H "Content-Type: application/json" \
              -X POST \
              --data @/tmp/rocket.json \
              "$WEBHOOK"
