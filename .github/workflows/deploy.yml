name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |
            LOG_FILE=/tmp/deploy.log

            rm -f $LOG_FILE
            touch $LOG_FILE

            cd /root/hari-event

            git fetch origin >> $LOG_FILE 2>&1
            git reset --hard origin/main >> $LOG_FILE 2>&1

            cd /root/hari-event/backend
            npm install --legacy-peer-deps >> $LOG_FILE 2>&1

            cd /root/hari-event/frontend
            npm install --legacy-peer-deps >> $LOG_FILE 2>&1

            npm run build >> $LOG_FILE 2>&1

            pm2 restart hari-event-backend >> $LOG_FILE 2>&1
            pm2 restart hari-event-frontend >> $LOG_FILE 2>&1

            pm2 save >> $LOG_FILE 2>&1

      - name: Rocket.Chat Success Notification
        if: success()
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "text":"✅ DEPLOYMENT SUCCESSFUL\n\nRepository : ${{ github.repository }}\nBranch : ${{ github.ref_name }}\nWorkflow : ${{ github.workflow }}\n\nStatus : Production Updated Successfully"
            }' \
            "${{ secrets.ROCKETCHAT_WEBHOOK_URL }}"

      - name: Rocket.Chat Failure Notification
        if: failure()
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "text":"🚨 CI/CD FAILURE\n\nRepository : ${{ github.repository }}\nBranch : ${{ github.ref_name }}\nWorkflow : ${{ github.workflow }}\n\nDeployment Failed"
            }' \
            "${{ secrets.ROCKETCHAT_WEBHOOK_URL }}"
