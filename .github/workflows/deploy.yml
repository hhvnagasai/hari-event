name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |

            set -e

            cd /home/ec2-user/hari-event

            echo "========== GIT PULL =========="
            git fetch origin
            git reset --hard origin/main

            echo "========== BACKEND INSTALL =========="
            cd backend
            npm install --legacy-peer-deps

            echo "========== FRONTEND INSTALL =========="
            cd ../frontend
            npm install --legacy-peer-deps

            echo "========== FRONTEND BUILD =========="
            npm run build

            echo "========== PM2 BACKEND =========="
            pm2 restart hari-event-backend

            echo "========== PM2 FRONTEND =========="
            pm2 restart hari-event-frontend

            pm2 save

      - name: RocketChat Success
        if: success()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"✅ DEPLOYMENT SUCCESSFUL\n\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nWorkflow: ${{ github.workflow }}\n\nStatus: Production Updated Successfully\"}" \
          "${{ secrets.ROCKETCHAT_WEBHOOK }}"

      - name: RocketChat Failure
        if: failure()
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"🚨 CI/CD FAILURE\n\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nWorkflow: ${{ github.workflow }}\n\nDeployment Failed\"}" \
          "${{ secrets.ROCKETCHAT_WEBHOOK }}"
