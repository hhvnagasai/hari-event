name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Logs Directory
        run: mkdir -p logs

      - name: Frontend Install
        run: |
          cd frontend
          npm install 2>&1 | tee ../logs/frontend-install.log

      - name: Frontend Build
        run: |
          cd frontend
          npm run build 2>&1 | tee ../logs/frontend-build.log

      - name: Backend Install
        run: |
          cd backend
          npm install --legacy-peer-deps 2>&1 | tee ../logs/backend-install.log

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /root/hari-event

            git pull origin main

            cd backend

            npm install --legacy-peer-deps

            pm2 restart hari-backend || pm2 start server.js --name hari-backend

            pm2 save

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/

      - name: Success Notification
        if: success()
        run: |
          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"✅ Deployment Successful"}'

  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Download Logs
        uses: actions/download-artifact@v4
        with:
          name: pipeline-logs
          path: logs

      - name: Create Error Summary
        run: |
          cat logs/*.log | tail -50 > error.log || echo "No logs found" > error.log

      - name: Send Failure Notification
        run: |
          ERROR_MSG=$(cat error.log | tr '\n' ' ' | sed 's/"/\\"/g')

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ PIPELINE FAILED | Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Logs: $ERROR_MSG\"}"
