name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      #################################################################
      # FRONTEND INSTALL
      #################################################################

      - name: Frontend Install
        id: frontend_install
        continue-on-error: true
        run: |
          cd frontend
          npm install > ../frontend_install.log 2>&1

      - name: Frontend Install Failure Notification
        if: steps.frontend_install.outcome == 'failure'
        run: |
          ERROR=$(tail -20 frontend_install.log | tr '\n' ' ' | sed 's/"/\\"/g')

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"❌ FRONTEND INSTALL FAILED | Repo: ${{ github.repository }} | Error: $ERROR\"}"

          exit 1

      #################################################################
      # FRONTEND BUILD
      #################################################################

      - name: Frontend Build
        id: frontend_build
        continue-on-error: true
        run: |
          cd frontend
          npm run build > ../frontend_build.log 2>&1

      - name: Frontend Build Failure Notification
        if: steps.frontend_build.outcome == 'failure'
        run: |
          ERROR=$(tail -20 frontend_build.log | tr '\n' ' ' | sed 's/"/\\"/g')

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"❌ FRONTEND BUILD FAILED | Repo: ${{ github.repository }} | Error: $ERROR\"}"

          exit 1

      #################################################################
      # BACKEND INSTALL
      #################################################################

      - name: Backend Install
        id: backend_install
        continue-on-error: true
        run: |
          cd backend
          npm install --legacy-peer-deps > ../backend_install.log 2>&1

      - name: Backend Install Failure Notification
        if: steps.backend_install.outcome == 'failure'
        run: |
          ERROR=$(tail -20 backend_install.log | tr '\n' ' ' | sed 's/"/\\"/g')

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"❌ BACKEND INSTALL FAILED | Repo: ${{ github.repository }} | Error: $ERROR\"}"

          exit 1

      #################################################################
      # DEPLOY TO EC2
      #################################################################

      - name: Deploy To EC2
        id: ec2_deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /root/hari-event

            git pull origin main

            cd backend

            npm install --legacy-peer-deps

            pm2 restart hari-backend || pm2 start server.js --name hari-backend

            pm2 save

      - name: Deployment Failure Notification
        if: steps.ec2_deploy.outcome == 'failure'
        run: |
          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"❌ EC2 DEPLOYMENT FAILED | Repo: ${{ github.repository }}\"}"

          exit 1

      #################################################################
      # SUCCESS
      #################################################################

      - name: Success Notification
        if: success()
        run: |
          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"✅ DEPLOYMENT SUCCESSFUL | Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  ai-failure-analysis:
    if: failure()
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Send Failure To AI Analyzer
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > /tmp/error.log << EOF2
            GitHub Actions Failure

            Repository: ${{ github.repository }}

            Branch: ${{ github.ref_name }}

            Workflow: Deploy Application

            Run URL:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            EOF2

            bash /opt/ai-analysis/process-error.sh /tmp/error.log
