name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Frontend Install
      - name: Frontend Install
        run: |
          cd frontend
          npm install > frontend-install.log 2>&1

      - name: Notify Frontend Install Failure
        if: failure()
        run: |
          ERROR=$(tail -20 frontend/frontend-install.log 2>/dev/null || echo "No log available")
          MESSAGE="❌ Frontend Install Failed | Repository: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Error: $ERROR"

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$MESSAGE\"}"

          exit 1

      # Frontend Build
      - name: Frontend Build
        run: |
          cd frontend
          npm run build > frontend-build.log 2>&1

      - name: Notify Frontend Build Failure
        if: failure()
        run: |
          ERROR=$(tail -20 frontend/frontend-build.log 2>/dev/null || echo "No log available")
          MESSAGE="❌ Frontend Build Failed | Repository: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Error: $ERROR"

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$MESSAGE\"}"

          exit 1

      # Backend Install
      - name: Backend Install
        run: |
          cd backend
          npm install --legacy-peer-deps > backend-install.log 2>&1

      - name: Notify Backend Install Failure
        if: failure()
        run: |
          ERROR=$(tail -20 backend/backend-install.log 2>/dev/null || echo "No log available")
          MESSAGE="❌ Backend Install Failed | Repository: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Error: $ERROR"

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$MESSAGE\"}"

          exit 1

      # Deploy To EC2
      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /root/hari-event

            git pull origin main

            cd backend

            npm install --legacy-peer-deps

            pm2 restart hari-backend || pm2 start server.js --name hari-backend

            pm2 save

      - name: Notify Deployment Failure
        if: failure()
        run: |
          MESSAGE="❌ EC2 Deployment Failed | Repository: ${{ github.repository }} | Branch: ${{ github.ref_name }}"

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$MESSAGE\"}"

          exit 1

      # Success Notification
      - name: Send Success Notification
        if: success()
        run: |
          MESSAGE="✅ Deployment Successful | Repository: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$MESSAGE\"}"
