name: Deploy Application

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Frontend Dependencies
    run: |
      cd frontend
      npm install 2>&1 | tee frontend-install.log

  - name: Build Frontend
    run: |
      cd frontend
      npm run build 2>&1 | tee frontend-build.log

  - name: Install Backend Dependencies
    run: |
      cd backend
      npm install --legacy-peer-deps 2>&1 | tee backend-install.log

  - name: Upload Build Logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: build-logs
      path: |
        frontend/frontend-install.log
        frontend/frontend-build.log
        backend/backend-install.log
```

deploy:
needs: build
runs-on: ubuntu-latest

```
steps:
  - name: Deploy to EC2
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USER }}
      key: ${{ secrets.EC2_SSH_KEY }}
      script: |
        set -e

        cd /root/hari-event

        git pull origin main

        cd backend

        npm install --legacy-peer-deps

        pm2 restart hari-backend || pm2 start server.js --name hari-backend

        pm2 save
```

notify-success:
needs: deploy
runs-on: ubuntu-latest

```
steps:
  - name: Send Success Message
    run: |
      curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
        -H "Content-Type: application/json" \
        --data "{\"text\":\"✅ Deployment Successful\nRepository: ${{ github.repository }}\nBranch: main\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
```

notify-failure:
if: failure()
needs: [build, deploy]
runs-on: ubuntu-latest

```
steps:
  - name: Send Failure Message
    run: |
      curl -X POST "${{ secrets.ROCKETCHAT_WEBHOOK }}" \
        -H "Content-Type: application/json" \
        --data "{\"text\":\"❌ Deployment Failed\nRepository: ${{ github.repository }}\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\nArtifacts: build-logs\"}"
```

