name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy and Notify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: false
          command_timeout: 60m

          script: |

            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"
            WORKFLOW="${{ github.workflow }}"
            WEBHOOK="${{ secrets.ROCKETCHAT_WEBHOOK }}"

            notify_failure() {

              STAGE="$1"
              LOGFILE="$2"

              LOGS=$(tail -20 "$LOGFILE")

              MESSAGE=$(cat <<MSG
🚨 CI/CD FAILURE

Repository : $REPO
Branch     : $BRANCH
Workflow   : $WORKFLOW

Failed Stage : $STAGE

Logs
----------------------------------------
$LOGS
----------------------------------------
MSG
)

              export MESSAGE

              python3 - <<'PY' > /tmp/rocket.json
import json
import os

print(json.dumps({
    "text": os.environ["MESSAGE"]
}))
PY

              curl -s \
                -H "Content-Type: application/json" \
                -X POST \
                --data @/tmp/rocket.json \
                "$WEBHOOK"

              exit 1
            }

            notify_success() {

              MESSAGE=$(cat <<MSG
✅ DEPLOYMENT SUCCESSFUL

Repository : $REPO
Branch     : $BRANCH
Workflow   : $WORKFLOW

Deployment Summary
----------------------------------------
Git Pull               : SUCCESS
Backend Install        : SUCCESS
Frontend Install       : SUCCESS
Frontend Build         : SUCCESS
PM2 Backend Restart    : SUCCESS
PM2 Frontend Restart   : SUCCESS
----------------------------------------
MSG
)

              export MESSAGE

              python3 - <<'PY' > /tmp/rocket.json
import json
import os

print(json.dumps({
    "text": os.environ["MESSAGE"]
}))
PY

              curl -s \
                -H "Content-Type: application/json" \
                -X POST \
                --data @/tmp/rocket.json \
                "$WEBHOOK"
            }

            cd /home/ec2-user/hari-event || notify_failure "Repository Access" /etc/hosts

            git fetch origin > /tmp/git.log 2>&1
            [ $? -eq 0 ] || notify_failure "Git Fetch" /tmp/git.log

            git reset --hard origin/main >> /tmp/git.log 2>&1
            [ $? -eq 0 ] || notify_failure "Git Reset" /tmp/git.log

            cd backend

            npm install --legacy-peer-deps > /tmp/backend.log 2>&1
            [ $? -eq 0 ] || notify_failure "Backend Install" /tmp/backend.log

            cd ../frontend

            npm install --legacy-peer-deps > /tmp/frontend-install.log 2>&1
            [ $? -eq 0 ] || notify_failure "Frontend Install" /tmp/frontend-install.log

            npm run build > /tmp/frontend-build.log 2>&1
            [ $? -eq 0 ] || notify_failure "Frontend Build" /tmp/frontend-build.log

            pm2 restart hari-event-backend > /tmp/pm2-backend.log 2>&1
            [ $? -eq 0 ] || notify_failure "PM2 Backend Restart" /tmp/pm2-backend.log

            pm2 restart hari-event-frontend > /tmp/pm2-frontend.log 2>&1
            [ $? -eq 0 ] || notify_failure "PM2 Frontend Restart" /tmp/pm2-frontend.log

            pm2 save > /tmp/pm2-save.log 2>&1

            notify_success
