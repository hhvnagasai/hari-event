name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Deploy and Notify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: false
          command_timeout: 60m

          script: |
            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"
            WORKFLOW="${{ github.workflow }}"
            WEBHOOK="${{ secrets.ROCKETCHAT_WEBHOOK }}"

            send_failure() {
              STAGE="$1"
              ERROR_LOG="$2"

              ERROR_LOG=$(echo "$ERROR_LOG" | tail -20 | sed 's/"/\\"/g')

              curl -s -X POST \
                -H "Content-Type: application/json" \
                -d "{
                  \"text\":\"🚨 CI/CD FAILURE\n\nRepository : $REPO\nBranch : $BRANCH\nWorkflow : $WORKFLOW\n\nFailed Stage\n------------------------\n$STAGE\n------------------------\n\nError Log\n------------------------\n$ERROR_LOG\n------------------------\n\nResult\n------------------------\nDeployment Stopped\n------------------------\"
                }" \
                "$WEBHOOK"

              exit 1
            }

            send_success() {
              curl -s -X POST \
                -H "Content-Type: application/json" \
                -d "{
                  \"text\":\"✅ DEPLOYMENT SUCCESSFUL\n\nRepository : $REPO\nBranch : $BRANCH\nWorkflow : $WORKFLOW\n\nDeployment Summary\n------------------------\nGit Pull ✓\nBackend Install ✓\nFrontend Install ✓\nFrontend Build ✓\nPM2 Backend ✓\nPM2 Frontend ✓\n------------------------\n\nStatus\n------------------------\nProduction Updated Successfully\n------------------------\"
                }" \
                "$WEBHOOK"
            }

            cd /home/ec2-user/hari-event || send_failure "Repository Access" "Cannot access repository"

            OUTPUT=$(git fetch origin 2>&1 && git reset --hard origin/main 2>&1)
            STATUS=$?
            [ $STATUS -eq 0 ] || send_failure "Git Pull" "$OUTPUT"

            OUTPUT=$(cd backend && npm install --legacy-peer-deps 2>&1)
            STATUS=$?
            [ $STATUS -eq 0 ] || send_failure "Backend Install" "$OUTPUT"

            OUTPUT=$(cd frontend && npm install --legacy-peer-deps 2>&1)
            STATUS=$?
            [ $STATUS -eq 0 ] || send_failure "Frontend Install" "$OUTPUT"

            OUTPUT=$(cd frontend && npm run build 2>&1)
            STATUS=$?
            [ $STATUS -eq 0 ] || send_failure "Frontend Build" "$OUTPUT"

            OUTPUT=$(pm2 restart hari-event-backend 2>&1)
            STATUS=$?
            [ $STATUS -eq 0 ] || send_failure "PM2 Restart Backend" "$OUTPUT"

            OUTPUT=$(pm2 restart hari-event-frontend 2>&1)
            STATUS=$?
            [ $STATUS -eq 0 ] || send_failure "PM2 Restart Frontend" "$OUTPUT"

            pm2 save >/dev/null 2>&1

            send_success
